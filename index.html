<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>PRDR Repo Hub</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-soft: #f9fafb;
      --text: #111827;
      --muted: #687385;
      --border: #d9dee7;
      --button: #111827;
      --button-text: #ffffff;
      --button-hover: #000000;
      --shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
      --focus: 0 0 0 4px rgba(17, 24, 39, 0.12);
    }

    html[data-theme="dark"] {
      --bg: #0d1117;
      --surface: #151b23;
      --surface-soft: #10161f;
      --text: #f0f3f6;
      --muted: #9aa6b2;
      --border: #303946;
      --button: #f0f3f6;
      --button-text: #0d1117;
      --button-hover: #ffffff;
      --shadow: none;
      --focus: 0 0 0 4px rgba(240, 243, 246, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(190px, 260px) auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .control,
    .theme-button {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      outline: none;
    }

    .control {
      width: 100%;
      padding: 0 14px;
    }

    .control:focus,
    .theme-button:focus-visible,
    .button:focus-visible {
      box-shadow: var(--focus);
    }

    .theme-button {
      padding: 0 15px;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }

    .theme-button:hover {
      border-color: var(--muted);
    }

    .status {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .card {
      display: flex;
      flex-direction: column;
      min-height: 182px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .repo-name {
      margin: 0 0 8px;
      font-size: 1.05rem;
      line-height: 1.3;
      word-break: break-word;
    }

    .description {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .badge {
      padding: 4px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 0.78rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: auto;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 9px 13px;
      border-radius: 11px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .primary {
      background: var(--button);
      color: var(--button-text);
    }

    .primary:hover {
      background: var(--button-hover);
    }

    .secondary {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }

    .secondary:hover {
      border-color: var(--muted);
    }

    .empty {
      grid-column: 1 / -1;
      min-height: auto;
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }

      .button:hover {
        transform: none;
      }
    }

    @media (max-width: 760px) {
      .page {
        width: min(100% - 24px, 1180px);
        padding: 18px 0;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .status {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="toolbar" aria-label="Repository controls">
      <input id="searchInput" class="control" type="search" placeholder="Search repositories" aria-label="Search repositories" />
      <select id="sortSelect" class="control" aria-label="Sort repositories">
        <option value="updated-desc">Newest updated</option>
        <option value="updated-asc">Oldest updated</option>
        <option value="created-desc">Newest created</option>
        <option value="created-asc">Oldest created</option>
        <option value="name-asc">Name A to Z</option>
        <option value="name-desc">Name Z to A</option>
      </select>
      <button id="themeButton" class="theme-button" type="button" aria-label="Toggle dark mode">Dark mode</button>
    </section>

    <section class="status" aria-live="polite">
      <span id="statusText">Loading repositories...</span>
      <span id="sourceText"></span>
    </section>

    <section id="repoGrid" class="grid" aria-label="Repository list"></section>
  </main>

  <script>
    const OWNER = "pcdelros";
    const THEME_KEY = "prdr-hub-theme";
    const SORT_KEY = "prdr-hub-sort";

    const FALLBACK_REPOS = [
      { name: "test", full_name: "pcdelros/test", description: "test", html_url: "https://github.com/pcdelros/test" },
      { name: "photogallery", full_name: "pcdelros/photogallery", description: "ASSIGNMENT // PHOTO GALLERY", html_url: "https://github.com/pcdelros/photogallery" },
      { name: "streamingmedia", full_name: "pcdelros/streamingmedia", description: "ASSIGNMENT // STREAMING MEDIA", html_url: "https://github.com/pcdelros/streamingmedia" },
      { name: "recipe", full_name: "pcdelros/recipe", description: "ASSIGNMENT // RECIPE", html_url: "https://github.com/pcdelros/recipe" },
      { name: "414test", full_name: "pcdelros/414test", description: "414test", html_url: "https://github.com/pcdelros/414test" },
      { name: "Accessible-Form-Page", full_name: "pcdelros/Accessible-Form-Page", description: "1.2 // Assignment: Accessible Form Page", html_url: "https://github.com/pcdelros/Accessible-Form-Page" },
      { name: "wunderlust", full_name: "pcdelros/wunderlust", description: "1.1 - 1.3 // Assignment", html_url: "https://github.com/pcdelros/wunderlust" },
      { name: "viewport", full_name: "pcdelros/viewport", description: "2.1 // Activity: Responsive CSS", html_url: "https://github.com/pcdelros/viewport" },
      { name: "nzre", full_name: "pcdelros/nzre", description: "", html_url: "https://github.com/pcdelros/nzre" },
      { name: "prdr-old-reference-library", full_name: "pcdelros/prdr-old-reference-library", description: "", html_url: "https://github.com/pcdelros/prdr-old-reference-library" },
      { name: "prdr-hub", full_name: "pcdelros/prdr-hub", description: "", html_url: "https://github.com/pcdelros/prdr-hub" },
      { name: "az-partyrentals", full_name: "pcdelros/az-partyrentals", description: "", html_url: "https://github.com/pcdelros/az-partyrentals" },
      { name: "phxwebspace", full_name: "pcdelros/phxwebspace", description: "", html_url: "https://github.com/pcdelros/phxwebspace" },
      { name: "az-paintball", full_name: "pcdelros/az-paintball", description: "", html_url: "https://github.com/pcdelros/az-paintball" },
      { name: "az-nailtech", full_name: "pcdelros/az-nailtech", description: "", html_url: "https://github.com/pcdelros/az-nailtech" },
      { name: "az-daycare", full_name: "pcdelros/az-daycare", description: "", html_url: "https://github.com/pcdelros/az-daycare" }
    ];

    const repoGrid = document.getElementById("repoGrid");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");
    const themeButton = document.getElementById("themeButton");
    const statusText = document.getElementById("statusText");
    const sourceText = document.getElementById("sourceText");

    let repos = [];
    let loadedFromGitHub = false;

    function getPreferredTheme() {
      const savedTheme = localStorage.getItem(THEME_KEY);

      if (savedTheme === "light" || savedTheme === "dark") {
        return savedTheme;
      }

      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem(THEME_KEY, theme);
      themeButton.textContent = theme === "dark" ? "Light mode" : "Dark mode";
      themeButton.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
    }

    function getWebsiteUrl(repo) {
      const homepage = repo.homepage && repo.homepage.trim();

      if (homepage) {
        return homepage.startsWith("http") ? homepage : `https://${homepage}`;
      }

      if (repo.name.toLowerCase() === `${OWNER}.github.io`) {
        return `https://${OWNER}.github.io/`;
      }

      return `https://${OWNER}.github.io/${repo.name}/`;
    }

    function getDateTime(value) {
      const date = value ? new Date(value) : null;
      return date && !Number.isNaN(date.getTime()) ? date.getTime() : 0;
    }

    function formatDate(value) {
      const date = value ? new Date(value) : null;

      if (!date || Number.isNaN(date.getTime())) {
        return "Saved repo";
      }

      return `Updated ${new Intl.DateTimeFormat(undefined, {
        month: "short",
        day: "numeric",
        year: "numeric"
      }).format(date)}`;
    }

    function sortRepos(list) {
      const sortValue = sortSelect.value;
      const sorted = [...list];

      sorted.sort((a, b) => {
        if (sortValue === "updated-desc") return getDateTime(b.updated_at) - getDateTime(a.updated_at);
        if (sortValue === "updated-asc") return getDateTime(a.updated_at) - getDateTime(b.updated_at);
        if (sortValue === "created-desc") return getDateTime(b.created_at) - getDateTime(a.created_at);
        if (sortValue === "created-asc") return getDateTime(a.created_at) - getDateTime(b.created_at);
        if (sortValue === "name-desc") return b.name.localeCompare(a.name);
        return a.name.localeCompare(b.name);
      });

      return sorted;
    }

    function createBadge(text) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = text;
      return badge;
    }

    function createRepoCard(repo) {
      const card = document.createElement("article");
      card.className = "card";

      const name = document.createElement("h2");
      name.className = "repo-name";
      name.textContent = repo.name;

      const description = document.createElement("p");
      description.className = "description";
      description.textContent = repo.description || "No description added yet.";

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.appendChild(createBadge(formatDate(repo.updated_at)));

      if (repo.archived) meta.appendChild(createBadge("Archived"));
      if (repo.fork) meta.appendChild(createBadge("Fork"));

      const actions = document.createElement("div");
      actions.className = "actions";

      const website = document.createElement("a");
      website.className = "button primary";
      website.href = getWebsiteUrl(repo);
      website.target = "_blank";
      website.rel = "noopener noreferrer";
      website.textContent = "Website";

      const source = document.createElement("a");
      source.className = "button secondary";
      source.href = repo.html_url || `https://github.com/${OWNER}/${repo.name}`;
      source.target = "_blank";
      source.rel = "noopener noreferrer";
      source.textContent = "Repo";

      actions.append(website, source);
      card.append(name, description, meta, actions);

      return card;
    }

    function renderRepos() {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = repos.filter((repo) => {
        const searchableText = `${repo.name} ${repo.description || ""}`.toLowerCase();
        return searchableText.includes(query);
      });
      const sorted = sortRepos(filtered);

      repoGrid.innerHTML = "";

      if (!sorted.length) {
        const empty = document.createElement("article");
        empty.className = "card empty";

        const title = document.createElement("h2");
        title.className = "repo-name";
        title.textContent = "No matching repositories";

        const text = document.createElement("p");
        text.className = "description";
        text.textContent = "Try a different search term or clear the search box.";

        empty.append(title, text);
        repoGrid.appendChild(empty);
        statusText.textContent = "No matches found.";
        return;
      }

      const fragment = document.createDocumentFragment();
      sorted.forEach((repo) => fragment.appendChild(createRepoCard(repo)));
      repoGrid.appendChild(fragment);

      const repoLabel = sorted.length === 1 ? "repo" : "repos";
      statusText.textContent = `${sorted.length} ${repoLabel} shown`;
      sourceText.textContent = loadedFromGitHub ? "Loaded from GitHub" : "Using saved fallback list";
    }

    async function loadRepos() {
      const savedSort = localStorage.getItem(SORT_KEY);
      if (savedSort) sortSelect.value = savedSort;

      try {
        const response = await fetch(`https://api.github.com/users/${OWNER}/repos?per_page=100&sort=updated`, {
          headers: { "Accept": "application/vnd.github+json" }
        });

        if (!response.ok) {
          throw new Error("GitHub API request failed");
        }

        repos = await response.json();
        loadedFromGitHub = true;
      } catch (error) {
        repos = FALLBACK_REPOS;
        loadedFromGitHub = false;
      }

      renderRepos();
    }

    searchInput.addEventListener("input", renderRepos);
    sortSelect.addEventListener("change", () => {
      localStorage.setItem(SORT_KEY, sortSelect.value);
      renderRepos();
    });
    themeButton.addEventListener("click", () => {
      const currentTheme = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
      setTheme(currentTheme === "dark" ? "light" : "dark");
    });

    setTheme(getPreferredTheme());
    loadRepos();
  </script>
</body>
</html>
